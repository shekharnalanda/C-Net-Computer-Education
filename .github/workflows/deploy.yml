name: Deploy website to BigRock

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bigrock-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Upload website by FTP
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}

    steps:
      - name: Check deployment configuration
        id: config
        shell: bash
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$FTP_SERVER_DIR" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "BigRock FTP secrets are not configured yet. Deployment skipped."
          fi

      - name: Download website files
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Deploy to BigRock
        if: steps.config.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            README.md
            UPLOAD-INSTRUCTIONS.txt
            *.zip
