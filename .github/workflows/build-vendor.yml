name: Build and Commit Production Vendor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vendor.yml'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-vendor-build
  cancel-in-progress: false

jobs:
  build-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build clean production dependencies
        run: |
          rm -rf vendor
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --optimize-autoloader

      - name: Commit production vendor to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f vendor
          if git diff --cached --quiet; then
            echo "Production vendor is already current."
          else
            git commit -m "Build PHP 8.3 production vendor"
            git push origin HEAD:main
          fi
